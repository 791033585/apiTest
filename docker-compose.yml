services:
  api-test:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-180}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-24000}
      RUN_LLM_TESTS: ${RUN_LLM_TESTS:-0}
      CASE_FILE: ${CASE_FILE:-/app/data/api_cases.xlsx}
      API_BASE_URL: ${API_BASE_URL:-}
    command: ["pytest", "-q"]
  web:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-180}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-24000}
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000"]
  demo-api:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: 8000
    expose:
      - "8000"
    command: ["python", "-m", "examples.demo_server"]
